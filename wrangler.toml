name = "starry-study"
main = "packages/worker/src/index.ts"
compatibility_date = "2026-11-12"
compatibility_flags = ["nodejs_compat"]

# 静态资源与 API 同域。Worker 里先处理 /api/*，最后才回退到 ASSETS，
# 不能指望 SPA fallback 兜 API（CF-05）。
[assets]
directory = "packages/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 下面两段用的是「本地占位值」，不是任何真实基础设施信息：
# Wrangler 连 --local 都要求 database_id 存在，缺了会直接拒绝加载配置，
# 新人 clone 下来连迁移都跑不了。全零 UUID 让本地 D1 落到 .wrangler/state，
# 线上真实 database_id / 桶名只放 wrangler.local.toml（已 gitignore）或 CI secret（CF-11）。
[[d1_databases]]
binding = "DB"
database_name = "starry-study"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "starry-study-local"

# 部署前请复制本文件为 wrangler.local.toml，补上：
#   [[d1_databases]] database_id = "<创建 D1 后得到的 ID>"
#   [[r2_buckets]]   bucket_name = "<你的桶名>"
#   routes = [{ pattern = "study.example.com/*", zone_name = "example.com" }]
# 然后用 npm run deploy（它带 --config wrangler.local.toml）。
# workers.dev 子域在中国大陆被 DNS 污染，不要把它写进任何默认配置。
